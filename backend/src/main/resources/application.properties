spring.application.name=listmatch-preflight

spring.config.import=optional:file:./application-local.properties

server.port=8085
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.connection-timeout=600000
spring.mvc.async.request-timeout=600000

spring.datasource.url=jdbc:h2:file:./data/preflight;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

preflight.async-threshold-bytes=10485760
preflight.chunk-upload-threshold-bytes=52428800
preflight.chunk-size-bytes=8388608
preflight.upload-dir=./data/uploads

# Narrative comes from Java templates (optional LLM keys in application-local.properties).
ai.enabled=false
